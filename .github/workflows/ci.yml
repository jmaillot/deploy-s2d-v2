name: CI

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester + PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          # Pinned to v5 major: the suite is authored against the v5 mock/assert API.
          # v6 migration is separate work (v6 changed mock scoping behavior).
          Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99 -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99
          Install-Module PSScriptAnalyzer -Force

      - name: Lint (errors fail the build)
        shell: powershell
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize
          $errors = $findings | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) { exit 1 }
          Write-Host 'Analyzer: 0 errors.'

      - name: Pester
        shell: powershell
        run: |
          Invoke-Pester -Path ./Tests -Output Detailed -CI
